# LS1021A-IoT: SGTL5000 on SAI2. Always run the hardware in stereo, so a
# mono stream is copied to both channels of the line output instead of
# filling only the left I2S slot. The plug also converts to the big-endian
# formats of the SAI FIFO.
pcm.!default {
	type plug
	slave {
		pcm "hw:0,0"
		channels 2
	}
	route_policy "duplicate"
}
ctl.!default {
	type hw
	card 0
}
